<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Floral profile banner</title>
  <desc id="desc">A soft pink banner decorated with static flowers and leaves.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f5"/>
      <stop offset="0.52" stop-color="#fce7f3"/>
      <stop offset="1" stop-color="#f3e8ff"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#be185d" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="20" fill="url(#background)"/>
  <rect width="1200" height="260" rx="20" fill="url(#dots)"/>

  <g opacity="0.95">
    <path d="M0 198 C88 144 132 194 218 118 C170 211 95 238 0 226Z" fill="#a7c4a0"/>
    <path d="M42 218 C72 156 115 121 172 90" fill="none" stroke="#56876d" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="84" cy="177" rx="32" ry="14" transform="rotate(-38 84 177)" fill="#79a987"/>
    <ellipse cx="130" cy="130" rx="30" ry="13" transform="rotate(28 130 130)" fill="#79a987"/>
    <g transform="translate(180 77)">
      <ellipse rx="27" ry="52" fill="#fb7185" transform="rotate(0) translate(0 -29)"/>
      <ellipse rx="27" ry="52" fill="#f472b6" transform="rotate(72) translate(0 -29)"/>
      <ellipse rx="27" ry="52" fill="#fb7185" transform="rotate(144) translate(0 -29)"/>
      <ellipse rx="27" ry="52" fill="#f472b6" transform="rotate(216) translate(0 -29)"/>
      <ellipse rx="27" ry="52" fill="#fb7185" transform="rotate(288) translate(0 -29)"/>
      <circle r="24" fill="#fbbf24"/>
    </g>
    <g transform="translate(62 78) scale(.62)">
      <ellipse rx="25" ry="48" fill="#c084fc" transform="translate(0 -27)"/>
      <ellipse rx="25" ry="48" fill="#d8b4fe" transform="rotate(90) translate(0 -27)"/>
      <ellipse rx="25" ry="48" fill="#c084fc" transform="rotate(180) translate(0 -27)"/>
      <ellipse rx="25" ry="48" fill="#d8b4fe" transform="rotate(270) translate(0 -27)"/>
      <circle r="20" fill="#fef3c7"/>
    </g>
  </g>

  <g transform="translate(1200 260) scale(-1 -1)" opacity="0.95">
    <path d="M0 198 C88 144 132 194 218 118 C170 211 95 238 0 226Z" fill="#a7c4a0"/>
    <path d="M42 218 C72 156 115 121 172 90" fill="none" stroke="#56876d" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="84" cy="177" rx="32" ry="14" transform="rotate(-38 84 177)" fill="#79a987"/>
    <ellipse cx="130" cy="130" rx="30" ry="13" transform="rotate(28 130 130)" fill="#79a987"/>
    <g transform="translate(180 77)">
      <ellipse rx="27" ry="52" fill="#fb7185" transform="translate(0 -29)"/>
      <ellipse rx="27" ry="52" fill="#f472b6" transform="rotate(72) translate(0 -29)"/>
      <ellipse rx="27" ry="52" fill="#fb7185" transform="rotate(144) translate(0 -29)"/>
      <ellipse rx="27" ry="52" fill="#f472b6" transform="rotate(216) translate(0 -29)"/>
      <ellipse rx="27" ry="52" fill="#fb7185" transform="rotate(288) translate(0 -29)"/>
      <circle r="24" fill="#fbbf24"/>
    </g>
    <g transform="translate(62 78) scale(.62)">
      <ellipse rx="25" ry="48" fill="#c084fc" transform="translate(0 -27)"/>
      <ellipse rx="25" ry="48" fill="#d8b4fe" transform="rotate(90) translate(0 -27)"/>
      <ellipse rx="25" ry="48" fill="#c084fc" transform="rotate(180) translate(0 -27)"/>
      <ellipse rx="25" ry="48" fill="#d8b4fe" transform="rotate(270) translate(0 -27)"/>
      <circle r="20" fill="#fef3c7"/>
    </g>
  </g>

  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="600" y="116" font-size="52" font-weight="700" fill="#831843">Zaineb Marzaq</text>
    <text x="600" y="161" font-size="20" letter-spacing="3" fill="#9d174d">FRONTEND DEVELOPER  •  CREATIVE MIND</text>
  </g>
